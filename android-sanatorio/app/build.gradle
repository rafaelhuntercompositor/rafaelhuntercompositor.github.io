plugins {
  id 'com.android.application'
}

android {
  namespace 'studio.hunter.sanatorio'
  compileSdk 35

  defaultConfig {
    applicationId 'studio.hunter.sanatorio'
    minSdk 23
    targetSdk 33
    versionCode 16
    versionName '0.16-android'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  buildTypes {
    debug {
      minifyEnabled false
    }
  }
}
