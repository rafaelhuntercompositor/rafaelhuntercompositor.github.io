name: Build Meu Financeiro Android

on:
  push:
    branches:
      - build/meu-financeiro-android
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p android-build
          base64 -d android_project.b64 > android-build/project.zip
          cd android-build
          unzip -q project.zip

      - name: Build release APK
        working-directory: android-build
        run: gradle --no-daemon clean assembleRelease

      - name: Rename APK
        run: cp android-build/app/build/outputs/apk/release/app-release.apk MeuFinanceiro-Android-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuFinanceiro-Android-APK
          path: MeuFinanceiro-Android-v1.0.0.apk
          if-no-files-found: error
