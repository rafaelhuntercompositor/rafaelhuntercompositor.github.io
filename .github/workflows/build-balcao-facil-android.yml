name: Build Balcao Facil Android 1.1.0

on:
  push:
    branches:
      - build/balcao-facil-android-v1-1-0-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android source package
        shell: bash
        run: |
          set -euo pipefail
          cat android_payload/part*.b64 > android-source.b64
          base64 -d android-source.b64 > BalcaoFacil-Android-v1.1.0-Projeto.zip
          mkdir -p extracted
          unzip -q BalcaoFacil-Android-v1.1.0-Projeto.zip -d extracted
          test -f extracted/BalcaoFacilAndroid-v1.1.0/app/build.gradle
          test -f extracted/BalcaoFacilAndroid-v1.1.0/app/src/main/AndroidManifest.xml

      - name: Patch build compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd extracted/BalcaoFacilAndroid-v1.1.0
          sed -i "s/version '9.1.1'/version '8.7.3'/" build.gradle
          sed -i 's/compileSdk 36/compileSdk 35/' app/build.gradle
          sed -i 's/targetSdk 36/targetSdk 35/' app/build.gradle
          echo '--- build.gradle ---'
          cat build.gradle
          echo '--- app/build.gradle ---'
          cat app/build.gradle

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd extracted/BalcaoFacilAndroid-v1.1.0
          gradle --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lah app/build/outputs/apk/release/

      - name: Validate and align APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -p -f 4 \
            extracted/BalcaoFacilAndroid-v1.1.0/app/build/outputs/apk/release/app-release-unsigned.apk \
            output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk | head -30

      - name: Upload installable build candidate
        uses: actions/upload-artifact@v4
        with:
          name: BalcaoFacil-Android-v1.1.0-unsigned
          path: output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk
          if-no-files-found: error
          retention-days: 7
