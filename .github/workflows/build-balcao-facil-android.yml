name: Build Balcao Facil Android 1.1.0

on:
  push:
    branches:
      - build/balcao-facil-android-v1-1-0-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild Android source package
        shell: bash
        run: |
          set -euo pipefail
          : > BalcaoFacil-Android-v1.1.0-Projeto.zip
          for part in android_payload/part*.b64; do
            echo "Decoding $part"
            base64 -d "$part" >> BalcaoFacil-Android-v1.1.0-Projeto.zip
          done
          unzip -t BalcaoFacil-Android-v1.1.0-Projeto.zip >/dev/null
          mkdir -p extracted
          unzip -q BalcaoFacil-Android-v1.1.0-Projeto.zip -d extracted
          test -f extracted/BalcaoFacilAndroid-v1.1.0/app/build.gradle
          test -f extracted/BalcaoFacilAndroid-v1.1.0/app/src/main/AndroidManifest.xml

      - name: Patch build compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd extracted/BalcaoFacilAndroid-v1.1.0
          sed -i "s/version '9.1.1'/version '8.7.3'/" build.gradle
          sed -i 's/compileSdk 36/compileSdk 35/' app/build.gradle
          sed -i 's/targetSdk 36/targetSdk 35/' app/build.gradle
          grep -q "version '8.7.3'" build.gradle
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd extracted/BalcaoFacilAndroid-v1.1.0
          gradle --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Validate and align APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -p -f 4 \
            extracted/BalcaoFacilAndroid-v1.1.0/app/build/outputs/apk/release/app-release-unsigned.apk \
            output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk | head -30
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" output/apksigner.jar

      - name: Upload APK and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: BalcaoFacil-Android-v1.1.0-build
          path: |
            output/BalcaoFacil-Android-v1.1.0-unsigned-aligned.apk
            output/apksigner.jar
          if-no-files-found: error
          retention-days: 7
