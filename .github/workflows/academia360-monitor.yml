name: Build Academia 360 Monitor

on:
  push:
    branches:
      - academia360-monitor-build
    paths:
      - 'academia360-monitor/**'
      - '.github/workflows/academia360-monitor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p academia360-monitor assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Academia360-Monitor-v1.1
          path: academia360-monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
