name: Sanatorio Android WebView Shell
on:
  push:
    branches: [sanatorio-android-crash-fix]
    paths:
      - 'android-sanatorio/**'
      - '.github/workflows/sanatorio-android-shell.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-sanatorio/**'
      - '.github/workflows/sanatorio-android-shell.yml'
  workflow_dispatch:
jobs:
  build-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android platform
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Activity and installable APK shell
        working-directory: android-sanatorio
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm signature and manifest
        run: |
          test -s android-sanatorio/app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging android-sanatorio/app/build/outputs/apk/debug/app-debug.apk | head -20
      - name: Publish shell to repack with full offline game assets
        uses: actions/upload-artifact@v4
        with:
          name: SANATORIO-ANDROID-NOVO-SHELL
          path: android-sanatorio/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
