name: Last Dawn GBA Quick Probe
on:
  push:
    branches: [hunter-last-dawn-gba-port]
    paths:
      - '.github/workflows/last-dawn-gba-quick.yml'
      - 'gba-port/quick_probe.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Obter ultima ROM GBA que exibiu a abertura
        uses: actions/download-artifact@v4
        with:
          name: LAST-DAWN-ROM-GBA
          run-id: '38109429286'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rom
      - name: Isolar temporariamente ciclo Lua _update
        run: |
          GBA_PROBE=simple python3 gba-port/quick_probe.py rom/LAST_DAWN_HUNTER_GBA.gba
      - name: Instalar bibliotecas de emulador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmgba-dev libpng-dev
          git clone --depth 1 https://github.com/JohnnySun/gba-rom-debugger.git
          make -C gba-rom-debugger MGBA_PREFIX=/usr LIBPNG_PREFIX=/usr bin/gba-walk
      - name: Rodar 1500 quadros no emulador
        run: |
          mkdir -p captures
          gba-rom-debugger/bin/gba-walk rom/LAST_DAWN_HUNTER_GBA.gba captures run:100 snap:frame100 run:500 snap:frame600 run:900 snap:frame1500
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LAST-DAWN-GBA-QUICK-PROBE
          path: captures/
          if-no-files-found: ignore
